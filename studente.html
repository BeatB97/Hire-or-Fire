<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Hire or Fire? — Studente</title>
<link rel="stylesheet" href="style.css?v=5">
<!-- Layout cellulare: tutto in una schermata, senza scorrere (v2) -->
<style>
body.voting{ overflow:hidden; }
body.voting .app{
  height:100vh; height:100dvh; min-height:0;
  padding: 6px 10px calc(8px + env(safe-area-inset-bottom, 0px));
}
body.voting .brand{ flex-direction:row; align-items:center; justify-content:space-between; margin:2px 2px 8px; gap:8px; flex-shrink:0; }
body.voting .brand .stamp-icon img{ width:84px; }
body.voting .kicker{ display:none; }
body.voting .hero-title{ font-size:22px; order:-1; }
body.voting .footer-note{ display:none; }

body.voting #voteScreen{ flex:1; min-height:0; display:flex !important; flex-direction:column; }
body.voting .folder-tab{ flex-shrink:0; padding:4px 4px 6px; font-size:10.5px; }
body.voting .folder{ flex:1; min-height:0; display:flex; flex-direction:column; border-radius:14px; }

body.voting .photo-wrap{ flex:1; min-height:110px; overflow:hidden; cursor:zoom-in; }
body.voting .photo-wrap img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
.zoom-hint{
  position:absolute; right:6px; top:6px; z-index:4;
  background:rgba(6,18,27,.7); color:#fff; font-family:var(--mono); letter-spacing:.04em;
  font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:999px;
  pointer-events:none;
}

body.voting .dossier-body{
  flex:0 1 auto; max-height:34%; overflow-y:auto;
  padding:7px 11px 9px; -webkit-overflow-scrolling:touch;
}
body.voting .field{ margin-bottom:5px; }
body.voting .field .label{ font-size:9.5px; margin-bottom:1px; }
body.voting .field .value{ font-size:13px; line-height:1.3; }
body.voting .quote-block{ padding:6px 9px; margin-top:2px; }
body.voting .quote-block .label{ font-size:9.5px; }
body.voting .quote-block p{ font-size:12px; line-height:1.4; margin-top:2px; }

body.voting .actions{ flex-shrink:0; margin-top:8px; gap:8px; }
body.voting .stamp-btn{ padding:12px 8px; font-size:15px; }
body.voting #waitStatus{
  flex-shrink:0; margin-top:8px; padding:8px 10px;
  background:var(--surface); border:1px solid var(--line); border-radius:14px; font-size:12px;
}
body.voting #waitStatus .big{ font-size:15px; margin-bottom:1px; }
body.voting .stamp-mark{ font-size:26px; padding:6px 18px; border-width:4px; }

/* Schermi molto bassi (es. telefono in orizzontale): testo ancora più compatto */
@media (max-height:600px){
  body.voting .brand{ display:none; }
  body.voting .dossier-body{ max-height:30%; }
  body.voting .quote-block p{ font-size:11.5px; }
}

/* Foto a schermo intero */
.lightbox{
  position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.92);
  display:none; align-items:center; justify-content:center;
}
.lightbox.show{ display:flex; }
.lightbox img{ max-width:100%; max-height:100%; object-fit:contain; }
.lightbox .close-hint{
  position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); right:12px;
  background:rgba(255,255,255,.15); color:#fff; font-size:13px; font-weight:600;
  padding:6px 12px; border-radius:999px;
}
</style>
</head>
<body>
<div class="app">

  <div class="brand">
    <span class="stamp-icon"><img src="img/logo-eurointerim-bianco.png" alt="Eurointerim"></span>
    <p class="kicker">&gt; chi assumeresti?</p>
    <h1 class="hero-title">Hire or <span class="accent">Fire?</span><span class="fire" aria-hidden="true">🔥</span></h1>
  </div>

  <!-- SCHERMATA 1: accesso alla stanza -->
  <div id="joinScreen" class="setup-box">
    <div id="roomFieldWrap">
      <label for="roomInput">Codice stanza (dato dal docente)</label>
      <input id="roomInput" type="text" maxlength="5" placeholder="es. TRK4G" autocomplete="off" style="text-transform:uppercase; letter-spacing:.1em; text-align:center; ">
    </div>
    <p id="prefilledRoomHint" style="display:none; font-size:12px; color:var(--brand-dark); margin-top:-6px; margin-bottom:16px;">Stanza <b id="prefilledRoomCode"></b> — scansionata dal QR code</p>
    <label for="nameInput">Il tuo nickname (comparirà in classifica)</label>
    <input id="nameInput" type="text" maxlength="16" placeholder="Nickname" autocomplete="off">
    <button class="control-btn primary" style="width:100%;" onclick="joinRoom()">Entra nella stanza</button>
    <p id="joinError" style="color:var(--reject); font-size:12px; margin-top:12px; display:none;"></p>
  </div>

  <!-- SCHERMATA 1bis: in attesa che il docente avvii il gioco -->
  <div id="waitingStartScreen" style="display:none;" class="status-panel">
    <div class="big">Ci sei, <span id="waitingName"></span>! 🎉</div>
    Stanza <b id="waitingRoomLabel"></b> — guarda il monitor:<br>il gioco sta per iniziare…
  </div>

  <!-- SCHERMATA 2: votazione -->
  <div id="voteScreen" style="display:none;">
    <div class="folder-tab">
      <span>STANZA <b id="roomLabel">—</b></span>
      <span id="cardProgress">—</span>
    </div>

    <div class="folder">
      <div class="photo-wrap" style="position:relative;" onclick="openZoom()">
        <img id="cardImg" src="" alt="">
        <span class="zoom-hint">🔍 Ingrandisci</span>
        <div class="stamp-overlay" id="stampOverlay">
          <div class="stamp-mark" id="stampMark"></div>
        </div>
      </div>
      <div class="dossier-body">
        <div class="field">
          <span class="label">Posizione desiderata</span>
          <span class="value" id="cardPosition"></span>
        </div>
        <div class="quote-block">
          <span class="label" id="cardQuoteLabel"></span>
          <p id="cardQuote"></p>
        </div>
      </div>
    </div>

    <div class="actions" id="actionsBar">
      <button class="stamp-btn skip" id="skipBtn" onclick="vote('skip')">✕ SKIP</button>
      <button class="stamp-btn match" id="matchBtn" onclick="vote('match')">♥ MATCH</button>
    </div>

    <div id="waitStatus" class="status-panel" style="display:none;">
      <div class="big">Risposta inviata ✔</div>
      Guarda il monitor: aspettiamo gli altri…
    </div>

    <div id="outcomeStatus" class="outcome-panel" style="display:none;">
      <div class="outcome-big" id="outcomeBig"></div>
      <div class="outcome-small" id="outcomeSmall"></div>
    </div>
  </div>

  <!-- SCHERMATA 3: risultati finali -->
  <div id="resultsScreen" style="display:none;">
    <div class="status-panel">
      <div class="big" id="finalRank"></div>
      <span id="finalScore"></span>
    </div>
    <div class="mini-board-title">Classifica</div>
    <div id="finalBoard" class="board"></div>
  </div>

  <div class="footer-note"><span>&gt; versione mobile 3</span><img class="claim" src="img/claim-people-bianco.png" alt="people. our passion"></div>
</div>

<!-- Foto a schermo intero -->
<div class="lightbox" id="lightbox" onclick="closeZoom()">
  <img id="lightboxImg" src="" alt="">
  <span class="close-hint">✕ Chiudi</span>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="cards-data.js"></script>
<script src="gioco.js?v=1"></script>
<script>
let ROOM = null;
let STUDENT_ID = localStorage.getItem('studentId');
if (!STUDENT_ID) {
  STUDENT_ID = 'stu_' + Math.random().toString(36).slice(2, 10);
  localStorage.setItem('studentId', STUDENT_ID);
}

let DATA = null;
let currentIndex = null;
let votedForCurrentIndex = false;

function $(id){ return document.getElementById(id); }

// Ricorda il nickname, così se il telefono ricarica la pagina basta ripremere "Entra"
$('nameInput').value = localStorage.getItem('hofNickname') || '';

// Se il QR code contiene già il codice stanza (?room=XXXXX), nascondiamo
// il campo "codice stanza" e chiediamo solo il nickname.
const urlParams = new URLSearchParams(window.location.search);
const prefilledRoom = urlParams.get('room') ? urlParams.get('room').toUpperCase() : null;
if (prefilledRoom) {
  $('roomFieldWrap').style.display = 'none';
  $('prefilledRoomHint').style.display = 'block';
  $('prefilledRoomCode').textContent = prefilledRoom;
}

function showError(msg){
  const errEl = $('joinError');
  errEl.textContent = msg;
  errEl.style.display = 'block';
}

function joinRoom(){
  const code = prefilledRoom || $('roomInput').value.trim().toUpperCase();
  const name = $('nameInput').value.trim();
  $('joinError').style.display = 'none';

  if (!code) return showError('Inserisci il codice stanza che vedi sul monitor.');
  if (!name) return showError('Scrivi un nickname: serve per la classifica.');

  db.ref('sessions/' + code + '/meta').once('value').then(snap => {
    if (!snap.exists()) return showError('Nessuna stanza trovata con questo codice. Controlla sul monitor.');
    ROOM = code;
    localStorage.setItem('hofNickname', name);
    $('roomLabel').textContent = ROOM;
    $('waitingRoomLabel').textContent = ROOM;
    $('waitingName').textContent = name;
    db.ref(`sessions/${ROOM}/students/${STUDENT_ID}`).set(name);
    $('joinScreen').style.display = 'none';
    preloadImages();
    db.ref('sessions/' + ROOM).on('value', s => {
      DATA = s.val();
      if (DATA) render();
    });
  }).catch(e => showError('Errore di connessione: ' + e.message));
}

function render(){
  const phase = DATA.phase || 'lobby';

  if (phase === 'final') return showFinal();

  if (phase === 'lobby') {
    setVotingLayout(false);
    currentIndex = null;
    $('waitingStartScreen').style.display = 'block';
    $('voteScreen').style.display = 'none';
    $('resultsScreen').style.display = 'none';
    return;
  }

  const idx = DATA.currentIndex || 0;
  if (idx !== currentIndex) {
    currentIndex = idx;
    renderCard(idx);
  }

  const myVote = votesAt(DATA, idx)[STUDENT_ID];
  votedForCurrentIndex = !!myVote;
  setButtonsEnabled(phase === 'question' && !myVote);

  if (phase === 'question') {
    showPanel(myVote ? 'wait' : 'actions');
    return;
  }

  // phase === 'reveal': com'è andata?
  const card = cardAt(DATA, idx);
  const board = computeLeaderboard(DATA);
  const me = board.find(r => r.id === STUDENT_ID);
  const rank = rankOf(board, STUDENT_ID);
  const panel = $('outcomeStatus');
  if (!myVote) {
    panel.className = 'outcome-panel none';
    $('outcomeBig').textContent = '⏱ Non hai risposto';
  } else if (myVote === card.answer) {
    panel.className = 'outcome-panel ok';
    $('outcomeBig').textContent = '✅ Giusto! +1';
  } else {
    panel.className = 'outcome-panel ko';
    $('outcomeBig').textContent = '❌ Sbagliato';
  }
  $('outcomeSmall').innerHTML =
    `Era <b>${escapeHtml(card.name)}</b> · risposta giusta: ${answerLabel(card.answer)}<br>` +
    (me ? `Hai <b>${me.score}</b> punti · sei <b>${rank}°</b> su ${board.length}` : '');
  showPanel('outcome');
}

// Al posto dei pulsanti mostra: i pulsanti, "risposta inviata" oppure l'esito
function showPanel(which){
  $('actionsBar').style.display = which === 'actions' ? 'flex' : 'none';
  $('waitStatus').style.display = which === 'wait' ? 'block' : 'none';
  $('outcomeStatus').style.display = which === 'outcome' ? 'block' : 'none';
}

function setVotingLayout(on){
  document.body.classList.toggle('voting', on);
  if (!on) closeZoom();
}

function openZoom(){
  const src = $('cardImg').src;
  if (!src) return;
  $('lightboxImg').src = src;
  $('lightbox').classList.add('show');
}
function closeZoom(){
  $('lightbox').classList.remove('show');
}

// Scarica in anticipo tutte le foto, così i profili compaiono subito sul telefono
function preloadImages(){
  CARDS.forEach(c => { const i = new Image(); i.src = c.img; });
}

function renderCard(idx){
  setVotingLayout(true);
  const card = cardAt(DATA, idx);
  $('waitingStartScreen').style.display = 'none';
  $('resultsScreen').style.display = 'none';
  $('voteScreen').style.display = 'block';
  $('cardProgress').textContent = `PROFILO ${idx+1}/${CARDS.length}`;
  $('cardImg').src = card.img;
  $('cardPosition').textContent = card.position;
  $('cardQuoteLabel').textContent = card.quoteLabel;
  $('cardQuote').textContent = card.quote;
  $('cardImg').alt = card.position;
  $('stampOverlay').classList.remove('show');
  closeZoom();
}

function setButtonsEnabled(enabled){
  $('skipBtn').disabled = !enabled;
  $('matchBtn').disabled = !enabled;
}

function vote(choice){
  if (votedForCurrentIndex || currentIndex === null || !DATA || DATA.phase !== 'question') return;
  votedForCurrentIndex = true;
  setButtonsEnabled(false);

  db.ref(`sessions/${ROOM}/votes/${currentIndex}/${STUDENT_ID}`).set(choice);

  const overlay = $('stampOverlay');
  const mark = $('stampMark');
  mark.textContent = choice === 'match' ? 'MATCH ♥' : 'SKIP ✕';
  mark.className = 'stamp-mark ' + (choice === 'match' ? 'approve' : 'reject');
  overlay.classList.add('show');
}

function showFinal(){
  setVotingLayout(false);
  $('waitingStartScreen').style.display = 'none';
  $('voteScreen').style.display = 'none';
  $('resultsScreen').style.display = 'block';
  const board = computeLeaderboard(DATA);
  const me = board.find(r => r.id === STUDENT_ID);
  const rank = rankOf(board, STUDENT_ID);
  const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
  $('finalRank').textContent = me ? `${medals[rank] || '🏁'} Sei ${rank}° su ${board.length}` : 'Classifica finale';
  $('finalScore').innerHTML = me ? `con <b>${me.score}</b> risposte giuste su ${CARDS.length}` : '';
  $('finalBoard').innerHTML = board.slice(0, 10).map(r => `
    <div class="board-row${r.id === STUDENT_ID ? ' me' : ''}">
      <span class="board-rank">${rankOf(board, r.id)}°</span>
      <span class="board-name">${escapeHtml(r.name)}</span>
      <span class="board-score">${r.score} pt</span>
    </div>`).join('');
}
</script>
</body>
</html>
